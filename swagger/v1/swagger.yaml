---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/admin/audit_logs":
    get:
      summary: List the audit log
      tags:
      - Audit logs
      security:
      - bearerAuth: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type: integer
      - name: log_action
        in: query
        required: false
        description: Action name, e.g. card.issue or brand.update
        schema:
          type: string
      - name: record_type
        in: query
        required: false
        description: Model name, e.g. Brand, Product, User or Card
        schema:
          type: string
      - name: from
        in: query
        format: date
        required: false
        description: Date (YYYY-MM-DD)
        schema:
          type: string
      - name: to
        in: query
        format: date
        required: false
        description: Date (YYYY-MM-DD)
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Returns only the entries created in the date range
        '422':
          description: Rejects the request when a date is not in YYYY-MM-DD format
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
  "/admin/brands":
    get:
      summary: List brands
      tags:
      - Brands
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Returns the second page when per_page is 1
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
    post:
      summary: Create a brand
      tags:
      - Brands
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Creates the brand and returns it
        '422':
          description: Rejects the brand when the name is already taken
        '400':
          description: Rejects the request when the brand params are missing
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                brand:
                  type: object
                  properties:
                    name:
                      type: string
                    custom_fields:
                      type: array
                      maxItems: 5
                      description: Optional, up to 5 fields
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                        - label
                        - value
                  required:
                  - name
              required:
              - brand
  "/admin/brands/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a brand
      tags:
      - Brands
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Returns the brand
        '404':
          description: Responds with Brand not found when the id does not match any
            brand
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
    patch:
      summary: Update a brand
      tags:
      - Brands
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Updates the brand and returns it
        '422':
          description: Rejects the update when another brand already has the name
        '404':
          description: Responds with Brand not found when the id does not match any
            brand
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                brand:
                  type: object
                  properties:
                    name:
                      type: string
                    custom_fields:
                      type: array
                      maxItems: 5
                      description: Replaces the current fields when sent
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                        - label
                        - value
              required:
              - brand
  "/admin/brands/{id}/state":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Change a brand's state
      tags:
      - Brands
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Deactivates the brand and returns it
        '422':
          description: Rejects the change when the state is not active or inactive
        '400':
          description: Rejects the request when the state is missing
        '404':
          description: Responds with Brand not found when the id does not match any
            brand
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                  - active
                  - inactive
              required:
              - state
  "/admin/clients/{client_id}/products":
    parameters:
    - name: client_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List the products a client can use
      tags:
      - Clients
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Returns only this client's products sorted by name
        '404':
          description: Responds with Client not found when the id belongs to an admin
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
    put:
      summary: Replace the products a client can use
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Removes all access when product_ids is empty
        '422':
          description: Rejects the change and keeps the current products when an id
            does not match any product
        '400':
          description: Rejects the request when product_ids is missing
        '404':
          description: Responds with Client not found when the id does not match any
            client
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_ids:
                  type: array
                  items:
                    type: integer
                  description: Send [] to remove all access
              required:
              - product_ids
  "/admin/clients":
    get:
      summary: List clients
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Returns clients sorted by email without admins
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
    post:
      summary: Create a client
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Creates the client and returns it without the password
        '422':
          description: Rejects the client when the payout rate is above 100
        '400':
          description: Rejects the request when the client params are missing
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                      minLength: 8
                    payout_rate:
                      type: string
                      example: '10.00'
                      description: 0 to 100
                  required:
                  - email
                  - password
                  - payout_rate
              required:
              - client
  "/admin/clients/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a client
      tags:
      - Clients
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Returns the client
        '404':
          description: Responds with Client not found when the id belongs to an admin
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
    patch:
      summary: Update a client
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Updates the client and returns it
        '422':
          description: Rejects the update when the payout rate is negative
        '404':
          description: Responds with Client not found when the id does not match any
            client
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                      minLength: 8
                    payout_rate:
                      type: string
                      example: '10.00'
                      description: 0 to 100
              required:
              - client
  "/admin/clients/{id}/state":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Change a client's state
      tags:
      - Clients
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Deactivates the client and returns it
        '422':
          description: Rejects the change when the state is not active or inactive
        '400':
          description: Rejects the request when the state is missing
        '404':
          description: Responds with Client not found when the id belongs to an admin
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                  - active
                  - inactive
              required:
              - state
  "/admin/brands/{brand_id}/products":
    parameters:
    - name: brand_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List a brand's products
      tags:
      - Products
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Returns only this brand's products sorted by name
        '404':
          description: Responds with Brand not found when the brand id does not match
            any brand
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
    post:
      summary: Create a product under a brand
      tags:
      - Products
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Creates the product under the brand and returns it
        '422':
          description: Rejects the product when the denomination is not positive
        '404':
          description: Responds with Brand not found when the brand id does not match
            any brand
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  properties:
                    name:
                      type: string
                    denomination:
                      type: string
                      example: '100000.00'
                    pin_required:
                      type: boolean
                      description: Defaults to true
                    custom_fields:
                      type: array
                      maxItems: 5
                      description: Optional, up to 5 fields
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                        - label
                        - value
                  required:
                  - name
                  - denomination
              required:
              - product
  "/admin/products/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a product
      tags:
      - Products
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Returns the product
        '404':
          description: Responds with Product not found when the id does not match
            any product
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
    patch:
      summary: Update a product
      tags:
      - Products
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Updates the product and returns it
        '422':
          description: Rejects the update when the brand already has a product with
            the name
        '404':
          description: Responds with Product not found when the id does not match
            any product
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  properties:
                    name:
                      type: string
                    denomination:
                      type: string
                      example: '100000.00'
                    pin_required:
                      type: boolean
                      description: Defaults to true
                    custom_fields:
                      type: array
                      maxItems: 5
                      description: Replaces the current fields when sent
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                        - label
                        - value
              required:
              - product
    delete:
      summary: Delete a product
      tags:
      - Products
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deletes the product and removes it from the clients that could
            use it
        '409':
          description: Rejects the delete when cards were already issued for the product
        '404':
          description: Responds with Product not found when the id does not match
            any product
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
  "/admin/products/{id}/state":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Change a product's state
      tags:
      - Products
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Activates the product and returns it
        '422':
          description: Rejects the change when the state is not active or inactive
        '400':
          description: Rejects the request when the state is missing
        '404':
          description: Responds with Product not found when the id does not match
            any product
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                  - active
                  - inactive
              required:
              - state
  "/admin/reports":
    get:
      summary: Report card spending and cancellations by brand or by client
      tags:
      - Reports
      security:
      - bearerAuth: []
      parameters:
      - name: report_type
        in: query
        enum:
        - brand
        - client
        required: true
        description: "Report totals by brand or by client:\n * `brand` \n * `client`
          \n "
        schema:
          type: string
      - name: brand_id
        in: query
        required: false
        description: Only this brand, when report_type is brand
        schema:
          type: integer
      - name: client_id
        in: query
        required: false
        description: Only this client, when report_type is client
        schema:
          type: integer
      - name: from
        in: query
        format: date
        required: false
        description: Date (YYYY-MM-DD)
        schema:
          type: string
      - name: to
        in: query
        format: date
        required: false
        description: Date (YYYY-MM-DD)
        schema:
          type: string
      responses:
        '200':
          description: Returns only the given brand when brand_id is set
        '422':
          description: Rejects the request when a date is not in YYYY-MM-DD format
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to a client
  "/auth/login":
    post:
      summary: Log in and get a token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: Returns a token and the user when the email and password are
            correct
        '401':
          description: Rejects the login when the user is deactivated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/auth/logout":
    post:
      summary: Log out and revoke the token
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Revokes the token so it cannot be used again
        '401':
          description: Rejects the request when the token is missing
  "/client/cards":
    post:
      summary: Issue a card
      tags:
      - Cards
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique per card request. Sending it again returns the same card
        schema:
          type: string
      responses:
        '201':
          description: Issues a new card for the product
        '200':
          description: Returns the same card when the request is sent again with the
            same key
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: true when the card was issued before
        '422':
          description: Rejects the request when the Idempotency-Key is longer than
            255 characters
        '404':
          description: Responds with Product not found when the client has no access
            to the product
        '400':
          description: Rejects the request when the Idempotency-Key header is missing
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to an admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
              required:
              - product_id
  "/client/cards/{id}/cancel":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Cancel a card
      tags:
      - Cards
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cancels the card and returns it
        '409':
          description: Rejects the request when the card is already cancelled
        '404':
          description: Responds with Card not found when the card belongs to another
            client
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to an admin
  "/client/products":
    get:
      summary: Browse the catalog
      tags:
      - Catalog
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: search_in
        in: query
        required: false
        schema:
          type: string
          enum:
          - product
          - brand
        description: Search only product names or only brand names. Searches both
          by default
      - name: min_denomination
        in: query
        required: false
        schema:
          type: string
      - name: max_denomination
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Returns only matching products when filters are given
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to an admin
  "/client/products/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a catalog product
      tags:
      - Catalog
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Returns the product
        '404':
          description: Responds with Product not found when the product is inactive
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to an admin
  "/client/reports/spending":
    get:
      summary: Report my spending and cancellations
      tags:
      - Reports
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        format: date
        required: false
        description: Date (YYYY-MM-DD)
        schema:
          type: string
      - name: to
        in: query
        format: date
        required: false
        description: Date (YYYY-MM-DD)
        schema:
          type: string
      responses:
        '200':
          description: Returns the client's spending and cancellations for cards issued
            in the range
        '422':
          description: Rejects the request when a date is not in YYYY-MM-DD format
        '401':
          description: Rejects the request when the token is missing
        '403':
          description: Rejects the request when the token belongs to an admin
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://localhost:3000
  description: Local
