---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/auth/login":
    post:
      summary: Log in and get a token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: returns a token
        '401':
          description: deactivated user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
servers:
- url: http://localhost:3000
  description: Local
